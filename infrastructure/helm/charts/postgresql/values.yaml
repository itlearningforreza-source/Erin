global:
  postgresql:
    auth:
      username: "postgres"
      password: ""
      database: "erin"
    existingSecret: "erin-secrets"
    secretKeys:
      adminPasswordKey: "database-url"
    port: 5432

primary:
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
  persistence:
    enabled: true
    size: "100Gi"
    storageClass: "gp3"
  replicas: 2
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: postgresql

readReplicas:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  persistence:
    enabled: true
    size: "100Gi"
    storageClass: "gp3"

pgbouncer:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  poolMode: "transaction"
  maxClientConn: 1000
  defaultPoolSize: 50
  minPoolSize: 10
  reservePoolSize: 5
  reservePoolTimeout: 5

postgresql:
  parameters:
    max_connections: "500"
    shared_buffers: "2GB"
    effective_cache_size: "6GB"
    maintenance_work_mem: "512MB"
    checkpoint_completion_target: "0.9"
    wal_buffers: "16MB"
    default_statistics_target: "100"
    random_page_cost: "1.1"
    effective_io_concurrency: "200"
    work_mem: "32MB"
    min_wal_size: "1GB"
    max_wal_size: "4GB"
    max_worker_processes: "8"
    max_parallel_workers_per_gather: "4"
    max_parallel_workers: "8"
    max_parallel_maintenance_workers: "4"

monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9187

metrics:
  enabled: true

service:
  type: ClusterIP
  ports:
    postgresql: 5432
    pgbouncer: 6432

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9187"
  prometheus.io/path: "/metrics"

podSecurityContext:
  enabled: true
  fsGroup: 999
  fsGroupChangePolicy: "OnRootMismatch"
  runAsUser: 999
  runAsGroup: 999
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: true
  runAsUser: 999
  runAsGroup: 999
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

volumePermissions:
  enabled: true

initdbScripts:
  01-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    CREATE EXTENSION IF NOT EXISTS "timescaledb";

  02-schema.sql: |
    -- Core tables will be created by application migrations
    -- This is just for initial setup
    
  03-permissions.sql: |
    GRANT ALL PRIVILEGES ON DATABASE erin TO postgres;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO postgres;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO postgres;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres;

backup:
  enabled: true
  schedule: "0 2 * * *"
  storageClass: "gp3"
  size: "50Gi"
  retention: "30d"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    namespace: erin-monitoring
    labels:
      release: prometheus