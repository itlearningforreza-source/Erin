apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-api
  namespace: erin-platform
spec:
  template:
    spec:
      containers:
      - name: market-data-api
        resources:
          requests:
            cpu: "1000m"
            memory: "1Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
      - name: metrics-exporter
        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"