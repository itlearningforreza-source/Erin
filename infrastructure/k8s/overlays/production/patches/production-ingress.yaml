apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-data-api-ingress
  namespace: erin-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  tls:
  - hosts:
    - api.erin.io
    - api-staging.erin.io
    secretName: tls-cert
  rules:
  - host: api.erin.io
    http:
      paths:
      - path: /api/v1/market-data
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/charts
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/watchlists
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/portfolios
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/risk
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/analytics
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/news
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /api/v1/fundamentals
        pathType: Prefix
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /ready
        pathType: Exact
        backend:
          service:
            name: market-data-api
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: market-data-api
            port:
              number: 9090