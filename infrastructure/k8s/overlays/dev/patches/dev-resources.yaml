apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-api
  namespace: erin-platform
spec:
  template:
    spec:
      containers:
      - name: market-data-api
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"