apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erin-platform

resources:
- ../../base

patchesStrategicMerge:
- patches/dev-replicas.yaml
- patches/dev-resources.yaml
- patches/dev-ingress.yaml

images:
- name: erin/market-data-api
  newTag: "dev"

configMapGenerator:
- name: erin-config
  behavior: merge
  literals:
  - environment=development
  - log-level=DEBUG
  - metrics-enabled=true
  - tracing-enabled=false

replicas:
- name: market-data-api
  count: 1

commonAnnotations:
  argocd.argoproj.io/sync-wave: "10"