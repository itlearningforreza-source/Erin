apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-api
  namespace: erin-platform
spec:
  template:
    spec:
      containers:
      - name: market-data-api
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"