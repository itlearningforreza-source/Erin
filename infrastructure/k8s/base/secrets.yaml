apiVersion: v1
kind: Secret
metadata:
  name: erin-secrets
  namespace: erin-platform
  labels:
    app.kubernetes.io/name: erin-secrets
    app.kubernetes.io/part-of: erin-platform
type: Opaque
stringData:
  # Database
  database-url: "postgresql://postgres:changeme@postgresql.erin-data.svc.cluster.local:5432/erin?sslmode=require"
  
  # Redis
  redis-url: "redis://:changeme@redis.erin-data.svc.cluster.local:6379/0"
  
  # JWT
  jwt-secret-key: "changeme-min-32-chars-long-secret"
  jwt-algorithm: "HS256"
  jwt-expiration-minutes: "60"
  jwt-refresh-expiration-days: "7"
  
  # Encryption
  encryption-key: "changeme-32-byte-encryption-key-here"
  
  # API Keys
  alpha-vantage-api-key: ""
  fred-api-key: ""
  openbb-api-key: ""
  
  # Monitoring
  grafana-admin-password: "changeme"
  alertmanager-webhook-url: ""
  pagerduty-integration-key: ""
  slack-webhook-url: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-cert
  namespace: erin-system
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: erin-platform
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
type: Opaque
stringData:
  admin.password: ""
  admin.passwordMtime: ""
  dex.config: ""
  oidc.config: ""