apiVersion: v1
kind: ServiceAccount
metadata:
  name: erin-platform-sa
  namespace: erin-platform
  labels:
    app.kubernetes.io/name: erin-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erin-market-data-sa
  namespace: erin-platform
  labels:
    app.kubernetes.io/name: market-data-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erin-platform-role
  namespace: erin-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: erin-platform-rolebinding
  namespace: erin-platform
subjects:
- kind: ServiceAccount
  name: erin-platform-sa
  namespace: erin-platform
roleRef:
  kind: Role
  name: erin-platform-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: erin-platform-clusterrole
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: erin-platform-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: erin-platform-sa
  namespace: erin-platform
roleRef:
  kind: ClusterRole
  name: erin-platform-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: market-data-role
  namespace: erin-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: market-data-rolebinding
  namespace: erin-platform
subjects:
- kind: ServiceAccount
  name: erin-market-data-sa
  namespace: erin-platform
roleRef:
  kind: Role
  name: market-data-role
  apiGroup: rbac.authorization.k8s.io