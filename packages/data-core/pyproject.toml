[project]
name = "erin-data_core"
version = "0.1.0"
description = "ERIN data-core package - Source registry and autonomous discovery"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "feedparser>=6.0.11",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.2.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["erin*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
